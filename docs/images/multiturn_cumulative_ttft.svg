<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
  <title id="title">Five-turn prefix-reuse cumulative TTFT</title>
  <desc id="desc">Stacked bars compare total TTFT of 10.295 seconds with KVM OFF and 5.240 seconds with KVM ON. Each segment represents one conversation turn.</desc>
  <rect width="800" height="350" fill="white"/>
  <g font-family="sans-serif" fill="#24292f">
    <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="600">5-turn prefix-reuse cumulative TTFT</text>
    <text x="420" y="326" text-anchor="middle" font-size="13">Cumulative TTFT (seconds)</text>
  </g>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="110" y1="65" x2="110" y2="295"/>
    <line x1="226" y1="65" x2="226" y2="295"/>
    <line x1="342" y1="65" x2="342" y2="295"/>
    <line x1="458" y1="65" x2="458" y2="295"/>
    <line x1="574" y1="65" x2="574" y2="295"/>
    <line x1="690" y1="65" x2="690" y2="295"/>
    <line x1="110" y1="295" x2="748" y2="295"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">
    <text x="110" y="313">0</text><text x="226" y="313">2</text>
    <text x="342" y="313">4</text><text x="458" y="313">6</text>
    <text x="574" y="313">8</text><text x="690" y="313">10</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#24292f" text-anchor="end" font-weight="600">
    <text x="98" y="132">KVM OFF</text>
    <text x="98" y="232">KVM ON</text>
  </g>
  <g>
    <rect x="110" y="95" width="125.8" height="55" fill="#0969da"/>
    <rect x="235.8" y="95" width="117.7" height="55" fill="#1f883d"/>
    <rect x="353.5" y="95" width="117.8" height="55" fill="#bf8700"/>
    <rect x="471.3" y="95" width="117.9" height="55" fill="#8250df"/>
    <rect x="589.2" y="95" width="118.0" height="55" fill="#cf222e"/>
    <rect x="110" y="195" width="125.9" height="55" fill="#0969da"/>
    <rect x="235.9" y="195" width="53.6" height="55" fill="#1f883d"/>
    <rect x="289.5" y="195" width="38.5" height="55" fill="#bf8700"/>
    <rect x="328.0" y="195" width="41.7" height="55" fill="#8250df"/>
    <rect x="369.7" y="195" width="44.2" height="55" fill="#cf222e"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">
    <text x="172.9" y="128">T1</text><text x="294.7" y="128">T2</text>
    <text x="412.4" y="128">T3</text><text x="530.2" y="128">T4</text><text x="648.2" y="128">T5</text>
    <text x="173.0" y="228">T1</text><text x="262.7" y="228">T2</text>
    <text x="308.8" y="228">T3</text><text x="348.9" y="228">T4</text><text x="391.8" y="228">T5</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#24292f" font-weight="600">
    <text x="715" y="128">10.295 s</text>
    <text x="422" y="228">5.240 s</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#24292f">
    <rect x="185" y="48" width="13" height="13" fill="#0969da"/><text x="204" y="59">Turn 1</text>
    <rect x="270" y="48" width="13" height="13" fill="#1f883d"/><text x="289" y="59">Turn 2</text>
    <rect x="355" y="48" width="13" height="13" fill="#bf8700"/><text x="374" y="59">Turn 3</text>
    <rect x="440" y="48" width="13" height="13" fill="#8250df"/><text x="459" y="59">Turn 4</text>
    <rect x="525" y="48" width="13" height="13" fill="#cf222e"/><text x="544" y="59">Turn 5</text>
  </g>
</svg>
